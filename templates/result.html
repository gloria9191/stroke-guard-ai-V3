<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>결과 - StrokeGuard AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background:#0f0f23;color:white">

<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card p-5 text-center text-white {{risk_class}}">
                <h1 class="display-1 fw-bold">{{prob}}%</h1>
                <h2 class="display-5 mb-4">{{risk_text}}군</h2>
                <div class="fs-3 mb-4">{{advice|safe}}</div>

                <button class="btn btn-light btn-lg mt-4 px-5" onclick="location.href='/'">
                    다시 검사하기
                </button>
            </div>
        </div>
    </div>
</div>

</body>
</html>
