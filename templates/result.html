<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StrokeGuard AI - 결과</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background:#0f0f23;
            font-family:"Noto Sans KR", sans-serif;
            color:white;
        }
        .card-box {
            max-width:900px;
            margin:60px auto;
            padding:50px;
            border-radius:25px;
            background:white;
            color:#333;
            box-shadow:0 10px 40px rgba(0,0,0,0.4);
            text-align:center;
        }
    </style>
</head>

<body>
<div class="card-box" style="background:{{ risk_class }}; color:white;">
    <h1 class="display-1 fw-bold">{{ prob }}%</h1>
    <h2 class="display-5 mb-4">{{ risk_text }}군</h2>

    <p class="fs-4 mt-4" style="line-height:1.7;">
        {{ advice|safe }}
    </p>

    <button class="btn btn-light btn-lg mt-5 px-5" onclick="location.href='/'">다시 검사하기</button>
</div>
</body>
</html>
