<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>결과 - StrokeGuard AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background: #111; color: white; text-align: center; }
        .result-box {
            min-height: 100vh;
            padding: 60px;
        }
        .high { background: linear-gradient(135deg,#ff6b6b,#feca57); }
        .low { background: linear-gradient(135deg,#1dd1a1,#54a0ff); }
    </style>
</head>

<body class="{{ risk_class }}">

<div class="result-box">
    <h1 class="display-1 fw-bold">{{ prob }}%</h1>
    <h2 class="mt-3">{{ risk_text }}군</h2>

    <div class="mt-5 fs-3 px-4" style="text-shadow:0 2px 10px rgba(0,0,0,0.25)">
        {{ advice|safe }}
    </div>

    <button class="btn btn-light btn-lg mt-5 px-5" onclick="location.href='/'">
        다시 검사하기
    </button>
</div>

</body>
</html>
