<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>StrokeGuard AI - 전문병원 위험 예측</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f1f5fb;
            font-family: 'Noto Sans KR', sans-serif;
        }
        .card {
            border-radius: 18px;
            border: none;
            box-shadow: 0px 4px 16px rgba(0,0,0,0.06);
        }
        .btn-primary {
            background: #0050b3;
            border: none;
            border-radius: 12px;
        }
        h1 {
            font-weight: 800;
            color: #003a75;
        }
    </style>
</head>
<body>

<div class="container py-5">
    <h1 class="text-center mb-2">StrokeGuard AI</h1>
    <p class="text-center text-muted mb-4">대학병원급 뇌졸중 조기 위험 분석 시스템</p>

    <div class="card p-4 mx-auto" style="max-width: 550px;">
        <form method="POST">

            <label class="form-label">성별 (남=1, 여=2)</label>
            <input name="Sex" class="form-control mb-3" required>

            <label class="form-label">나이</label>
            <input name="Age" class="form-control mb-3" required>

            <label class="form-label">BMI</label>
            <input name="BMI" class="form-control mb-3" required>

            <label class="form-label">수축기 혈압(SBP)</label>
            <input name="SBP" class="form-control mb-3" required>

            <label class="form-label">이완기 혈압(DBP)</label>
            <input name="DBP" class="form-control mb-3" required>

            <label class="form-label">공복 혈당</label>
            <input name="Glucose" class="form-control mb-3" required>

            <label class="form-label">흡연 여부 (0=No, 1=Yes)</label>
            <input name="Smoking" class="form-control mb-3" required>

            <label class="form-label">음주 여부 (0=No, 1=Yes)</label>
            <input name="Alcohol" class="form-control mb-3" required>

            <button class="btn btn-primary w-100 mt-3">위험도 분석</button>
        </form>

        {% if result is not none %}
        <div class="alert alert-info mt-4">
            <h5>예측 결과: <strong>{{ result }}%</strong></h5>
            <p>{{ explanation }}</p>
        </div>
        {% endif %}
    </div>
</div>

</body>
</html>
