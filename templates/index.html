<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StrokeGuard AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { margin:0; background:#0f0f23; color:white; font-family:'Noto Sans KR',sans-serif; overflow-x:hidden }
        .hero { min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; }
        .container-box { max-width:700px; margin:40px auto; background:white; color:#333; padding:40px; border-radius:25px; display:none }
        .step-box{display:none}
        .step-box.active{display:block}
        .btn-opt{ width:48%; padding:16px; }
        #result{ display:none; padding:40px; text-align:center }
        #loading-screen{ position:fixed; inset:0; background:#000a; display:none; align-items:center; justify-content:center; flex-direction:column; z-index:9999 }
    </style>
</head>

<body>

<!-- START PAGE -->
<div class="hero" id="hero">
    <h1 class="mb-4 display-3">StrokeGuard AI</h1>
    <button class="btn btn-primary btn-lg" onclick="startSurvey()">시작하기</button>
</div>

<!-- SURVEY -->
<div class="container-box" id="survey">

    <div class="progress mb-4">
        <div class="progress-bar" id="prog" style="width:12.5%"></div>
    </div>

    <h3 id="question" class="text-center mb-4">1/8 성별을 선택해주세요</h3>

    <div id="step1" class="step-box active text-center">
        <button class="btn-opt active" data-value="1">남성</button>
        <button class="btn-opt" data-value="2">여성</button>
    </div>

    <div id="step2" class="step-box"><input id="age" type="number" class="form-control text-center" placeholder="나이"></div>
    <div id="step3" class="step-box"><input id="bmi" type="number" step="0.1" class="form-control text-center" placeholder="BMI"></div>
    <div id="step4" class="step-box"><input id="sbp" type="number" class="form-control text-center" placeholder="수축기 혈압"></div>
    <div id="step5" class="step-box"><input id="dbp" type="number" class="form-control text-center" placeholder="이완기 혈압"></div>
    <div id="step6" class="step-box"><input id="glucose" type="number" class="form-control text-center" placeholder="공복 혈당"></div>

    <div id="step7" class="step-box text-center">
        <button class="btn-opt active" data-value="0">흡연 안함</button>
        <button class="btn-opt" data-value="1">흡연함</button>
    </div>

    <div id="step8" class="step-box text-center">
        <button class="btn-opt active" data-value="0">음주 안함</button>
        <button class="btn-opt" data-value="1">음주함</button>
    </div>

    <div class="text-center mt-4">
        <button id="prev" class="btn btn-outline-secondary me-3 d-none">이전</button>
        <button id="next" class="btn btn-primary">다음</button>
        <button id="submit" class="btn btn-danger d-none">예측하기</button>
    </div>
</div>

<!-- RESULT -->
<div id="result">
    <h1 id="r_prob" class="display-2"></h1>
    <h3 id="r_risk"></h3>
    <p id="r_advice" class="mt-4"></p>
    <button class="btn btn-light mt-4" onclick="location.reload()">다시 검사하기</button>
</div>

<!-- LOADING -->
<div id="loading-screen">
    <h3 class="mb-3">AI 분석 중...</h3>
    <div class="spinner-border text-light" style="width:4rem;height:4rem"></div>
</div>

<script>
function startSurvey(){
    hero.style.display="none";
    survey.style.display="block";
}

let step=1;
const data={gender:1, smoking:0, drinking:0};
const questions=["성별을 선택해주세요","나이를 입력해주세요","BMI를 입력해주세요","수축기 혈압","이완기 혈압","공복 혈당","흡연 여부","음주 여부"];

function showStep(){
    document.querySelectorAll(".step-box").forEach(s=>s.classList.remove("active"));
    document.getElementById("step"+step).classList.add("active");
    question.innerText=`${step}/8 ${questions[step-1]}`;
    prog.style.width=(step/8*100)+"%";
}

document.querySelectorAll(".btn-opt").forEach(btn=>{
    btn.onclick=function(){
        this.parentNode.querySelectorAll(".btn-opt").forEach(x=>x.classList.remove("active"));
        this.classList.add("active");
    }
});

next.onclick=()=>{
    // 값 가져오기
    if(step===1){
        data.gender=document.querySelector("#step1 .active").dataset.value;
    }

    if(step>=2 && step<=6){
        const keys={2:"age",3:"bmi",4:"sbp",5:"dbp",6:"glucose"};
        const key=keys[step];
        const v=document.getElementById(key).value.trim();
        if(!v){ alert("값을 입력해주세요"); return; }
        data[key]=v;
    }

    if(step===7) data.smoking=document.querySelector("#step7 .active").dataset.value;
    if(step===8) data.drinking=document.querySelector("#step8 .active").dataset.value;

    if(step<8){
        step++; showStep();
        prev.classList.remove("d-none");
        if(step===8){
            next.classList.add("d-none");
            submit.classList.remove("d-none");
        }
    }
};

prev.onclick=()=>{
    if(step>1){
        step--; showStep();
        next.classList.remove("d-none");
        submit.classList.add("d-none");
        if(step===1) prev.classList.add("d-none");
    }
};

submit.onclick=()=>{
    loading-screen.style.display="flex";

    const formData=new FormData();
    for(const k in data) formData.append(k,data[k]);

    fetch("/predict",{method:"POST",body:formData})
    .then(r=>r.json())
    .then(res=>{
        loading-screen.style.display="none";
        survey.style.display="none";
        result.style.display="block";

        r_prob.innerText = res.prob + "%";
        r_risk.innerText = res.risk_text + "군";
        r_advice.innerHTML = res.advice;
    })
    .catch(()=>{
        alert("예측 오류");
        location.reload();
    });
}
</script>

</body>
</html>
