<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StrokeGuard AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body { background:#0f0f23; color:white; }
        .hero { min-height:100vh; display:flex; align-items:center; justify-content:center; flex-direction:column; }
        .btn-start { padding:20px 40px; font-size:1.6rem; border-radius:50px; background:#6c5ce7; color:white; border:none; }
        .card { background:white; color:#333; border-radius:25px; padding:40px; }
        .btn-opt { width:48%; padding:20px; font-size:1.3rem; border:2px solid #6c5ce7; border-radius:20px; }
        .btn-opt.active, .btn-opt:hover { background:#6c5ce7; color:white; }
    </style>
</head>

<body>

<!-- HERO -->
<div class="hero" id="hero">
    <h1 class="display-3 fw-bold">StrokeGuard AI</h1>
    <p class="mt-3">AI 기반 뇌졸중 발병 확률 분석</p>
    <button class="btn-start mt-4" onclick="startSurvey()">시작하기</button>
</div>

<!-- SURVEY -->
<div class="container d-none mt-5" id="survey">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">

                <h3 class="text-center mb-4" id="question">1/8 성별을 선택해주세요</h3>

                <div id="step1">
                    <button class="btn-opt active" data-value="1">남성</button>
                    <button class="btn-opt" data-value="2">여성</button>
                </div>

                <div id="step2" class="d-none">
                    <input type="number" id="height" class="form-control form-control-lg text-center" placeholder="키 (cm)">
                </div>

                <div id="step3" class="d-none">
                    <input type="number" id="weight" class="form-control form-control-lg text-center" placeholder="몸무게 (kg)">
                </div>

                <div id="step4" class="d-none">
                    <input type="number" id="sbp" class="form-control form-control-lg text-center" placeholder="수축기 혈압">
                </div>

                <div id="step5" class="d-none">
                    <input type="number" id="dbp" class="form-control form-control-lg text-center" placeholder="이완기 혈압">
                </div>

                <div id="step6" class="d-none">
                    <input type="number" id="glucose" class="form-control form-control-lg text-center" placeholder="공복 혈당">
                </div>

                <div id="step7" class="d-none">
                    <button class="btn-opt active" data-value="0">흡연 안함</button>
                    <button class="btn-opt" data-value="1">흡연함</button>
                </div>

                <div id="step8" class="d-none">
                    <button class="btn-opt active" data-value="0">음주 안함</button>
                    <button class="btn-opt" data-value="1">음주함</button>
                </div>

                <div class="text-center mt-4">
                    <button class="btn btn-secondary d-none" id="prev">이전</button>
                    <button class="btn btn-primary" id="next">다음</button>
                    <button class="btn btn-danger d-none" id="submit">예측하기</button>
                </div>

            </div>
        </div>
    </div>
</div>

<script>
function startSurvey(){
    document.getElementById("hero").classList.add("d-none");
    document.getElementById("survey").classList.remove("d-none");
}

let step = 1;
const data = {};

document.querySelectorAll(".btn-opt").forEach(btn=>{
    btn.onclick = () => {
        btn.parentNode.querySelectorAll(".btn-opt")
            .forEach(b=>b.classList.remove("active"));
        btn.classList.add("active");
    };
});

document.getElementById("next").onclick = () => {

    if(step===1) data.gender = document.querySelector("#step1 .active").dataset.value;
    if(step===2){
        data.height = document.getElementById("height").value;
        if(!data.height) return alert("키 입력");
    }
    if(step===3){
        data.weight = document.getElementById("weight").value;
        if(!data.weight) return alert("몸무게 입력");
    }
    if(step===4) data.sbp = document.getElementById("sbp").value;
    if(step===5) data.dbp = document.getElementById("dbp").value;
    if(step===6) data.glucose = document.getElementById("glucose").value;
    if(step===7) data.smoking = document.querySelector("#step7 .active").dataset.value;
    if(step===8) data.drinking = document.querySelector("#step8 .active").dataset.value;

    document.getElementById("step"+step).classList.add("d-none");
    step++;
    document.getElementById("step"+step).classList.remove("d-none");

    if(step===8){
        document.getElementById("next").classList.add("d-none");
        document.getElementById("submit").classList.remove("d-none");
    }

    document.getElementById("prev").classList.remove("d-none");
    document.getElementById("question").innerText = `${step}/8`;
};

document.getElementById("prev").onclick = () => {
    document.getElementById("step"+step).classList.add("d-none");
    step--;
    document.getElementById("step"+step).classList.remove("d-none");

    if(step===1) document.getElementById("prev").classList.add("d-none");
    document.getElementById("submit").classList.add("d-none");
    document.getElementById("next").classList.remove("d-none");

    document.getElementById("question").innerText = `${step}/8 `;
};

document.getElementById("submit").onclick = () => {
    document.getElementById("survey").innerHTML = `
        <div style="height:70vh; display:flex; flex-direction:column; justify-content:center; align-items:center; color:white">
            <h2>AI가 예측 중입니다...</h2>
            <div class="spinner-border text-light" style="width:5rem;height:5rem;"></div>
        </div>
    `;

    const form = document.createElement("form");
    form.method="POST";
    form.action="/predict";

    for(const k in data){
        const input = document.createElement("input");
        input.type="hidden";
        input.name=k;
        input.value=data[k];
        form.appendChild(input);
    }

    document.body.appendChild(form);
    form.submit();
};
</script>

</body>
</html>
