<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StrokeGuard AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {margin:0;background:#0f0f23;color:white;font-family:'Noto Sans KR',sans-serif;overflow-x:hidden}
        .hero{min-height:100vh;background:linear-gradient(135deg,#0f0f23,#1a1a3a,#2d1b69);display:flex;align-items:center;justify-content:center;position:relative}
        .hero-content{position:relative;z-index:2;max-width:900px;text-align:center;padding:0 20px}
        .title{font-size:clamp(4rem,10vw,7rem);font-weight:900;margin:0 0 1.5rem;line-height:0.9}
        .stroke{background:linear-gradient(90deg,#ff6b6b,#feca57);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .guard{color:#a29bfe;text-shadow:0 0 30px rgba(162,155,254,0.6)}
        .progress{height:10px;border-radius:12px;background:#ddd}
        .progress-bar{background:linear-gradient(90deg,#a29bfe,#6c5ce7)}
        .btn-opt{width:48%;padding:20px;font-size:1.4rem;border:3px solid #6c5ce7;border-radius:18px;background:white;color:#6c5ce7;font-weight:700}
        .btn-opt.active,.btn-opt:hover{background:#6c5ce7;color:white}
        .btn-step{background:linear-gradient(135deg,#a29bfe,#6c5ce7);color:white;padding:16px 60px;border-radius:40px;font-size:1.3rem;font-weight:700}
    </style>
</head>

<body>

<!-- HERO SECTION -->
<div class="hero">
    <div class="hero-content">
        <h1 class="title"><span class="stroke">Stroke</span><span class="guard">Guard</span> AI</h1>
        <p class="lead">국내 500만 명 + 미국 라벨링 데이터 기반 예측 AI</p>
    </div>
</div>

<!-- SURVEY -->
<div class="container my-5" id="survey">
    <div class="row justify-content-center"><div class="col-lg-8">
        <div class="card p-5 text-dark">

            <div class="progress mb-4">
                <div class="progress-bar" id="prog" style="width:12.5%"></div>
            </div>

            <h2 class="text-center mb-4" id="question">1/8 성별을 선택해주세요</h2>

            <!-- Step 1 -->
            <div id="step1" class="text-center mb-3">
                <button class="btn btn-opt active" data-value="1">남성</button>
                <button class="btn btn-opt" data-value="2">여성</button>
            </div>

            <!-- Step 2: 나이 -->
            <div id="step2" class="d-none text-center">
                <input type="number" class="form-control form-control-lg text-center" id="age" placeholder="나이 (예: 65)">
            </div>

            <!-- Step 3: 키/몸무게 입력 -->
            <div id="step3" class="d-none text-center">
                <input type="number" id="height" class="form-control form-control-lg mb-3 text-center" placeholder="키 (cm)">
                <input type="number" id="weight" class="form-control form-control-lg text-center" placeholder="몸무게 (kg)">
            </div>

            <!-- Step 4: SBP -->
            <div id="step4" class="d-none text-center">
                <input type="number" id="sbp" class="form-control form-control-lg text-center" placeholder="수축기 혈압 (예: 140)">
            </div>

            <!-- Step 5: DBP -->
            <div id="step5" class="d-none text-center">
                <input type="number" id="dbp" class="form-control form-control-lg text-center" placeholder="이완기 혈압 (예: 90)">
            </div>

            <!-- Step 6: Glucose -->
            <div id="step6" class="d-none text-center">
                <input type="number" id="glucose" class="form-control form-control-lg text-center" placeholder="공복 혈당 (예: 110)">
            </div>

            <!-- Step 7: Smoking -->
            <div id="step7" class="d-none text-center">
                <button class="btn btn-opt active" data-value="0">비흡연</button>
                <button class="btn btn-opt" data-value="1">흡연</button>
            </div>

            <!-- Step 8: Drinking -->
            <div id="step8" class="d-none text-center">
                <button class="btn btn-opt active" data-value="0">비음주</button>
                <button class="btn btn-opt" data-value="1">음주</button>
            </div>

            <div class="text-center mt-4">
                <button id="prev" class="btn btn-outline-dark btn-lg me-3 d-none">이전</button>
                <button id="next" class="btn btn-step">다음</button>
                <button id="submit" class="btn btn-danger btn-lg d-none">지금 예측하기</button>
            </div>

        </div>
    </div></div>
</div>

<!-- RESULT -->
<div class="container my-5 d-none" id="result"></div>

<script>
let step = 1;
const questions = [
    "성별을 선택해주세요",
    "나이를 입력해주세요",
    "키와 몸무게를 입력해주세요",
    "수축기 혈압을 입력해주세요",
    "이완기 혈압을 입력해주세요",
    "공복 혈당을 입력해주세요",
    "흡연 상태를 선택해주세요",
    "음주 상태를 선택해주세요"
];

const data = {gender:1, smoking:0, drinking:0};

document.querySelectorAll(".btn-opt").forEach(btn=>{
    btn.onclick = function(){
        this.parentNode.querySelectorAll(".btn-opt").forEach(b=>b.classList.remove("active"));
        this.classList.add("active");
    }
});

document.getElementById("next").onclick = () => {
    if(step===1) data.gender=document.querySelector("#step1 .active").dataset.value;
    if(step===2){
        let age=document.getElementById("age").value;
        if(!age || age<=0){ alert("나이를 입력해주세요"); return; }
        data.age=parseInt(age);
    }
    if(step===3){
        let h=document.getElementById("height").value;
        let w=document.getElementById("weight").value;
        if(!h || !w || h<=0 || w<=0){
            alert("키와 몸무게를 정확히 입력해주세요");
            return;
        }
        data.bmi = (w/(h/100)**2).toFixed(1);
    }
    if(step===4){
        let v=document.getElementById("sbp").value;
        if(!v || v<=0){ alert("수축기 혈압을 입력해주세요"); return; }
        data.sbp=parseFloat(v);
    }
    if(step===5){
        let v=document.getElementById("dbp").value;
        if(!v || v<=0){ alert("이완기 혈압을 입력해주세요"); return; }
        data.dbp=parseFloat(v);
    }
    if(step===6){
        let v=document.getElementById("glucose").value;
        if(!v || v<=0){ alert("공복 혈당을 입력해주세요"); return; }
        data.glucose=parseFloat(v);
    }
    if(step===7){
        data.smoking=document.querySelector("#step7 .active").dataset.value;
    }
    if(step===8){
        data.drinking=document.querySelector("#step8 .active").dataset.value;
    }

    if(step<8){
        document.getElementById("step"+step).classList.add("d-none");
        step++;
        document.getElementById("step"+step).classList.remove("d-none");

        document.getElementById("question").innerText = `${step}/8 ${questions[step-1]}`;
        document.getElementById("prog").style.width=(step/8*100)+"%";

        if(step>1) document.getElementById("prev").classList.remove("d-none");
        if(step===8){
            document.getElementById("next").classList.add("d-none");
            document.getElementById("submit").classList.remove("d-none");
        }
    }
};

document.getElementById("prev").onclick = () => {
    document.getElementById("step"+step).classList.add("d-none");
    step--;
    document.getElementById("step"+step).classList.remove("d-none");
    document.getElementById("question").innerText=`${step}/8 ${questions[step-1]}`;
    document.getElementById("prog").style.width=(step/8*100)+"%";

    document.getElementById("submit").classList.add("d-none");
    document.getElementById("next").classList.remove("d-none");
    if(step===1) document.getElementById("prev").classList.add("d-none");
};

document.getElementById("submit").onclick = () => {
    document.getElementById("survey").classList.add("d-none");
    document.getElementById("result").classList.remove("d-none");
    document.getElementById("result").innerHTML = `
        <div class="text-center text-white py-5">
            <h2>AI가 분석 중입니다...</h2>
            <div class="spinner-border text-light" style="width:4rem;height:4rem;"></div>
        </div>
    `;

    fetch("/predict",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(data)
    })
    .then(r=>r.json())
    .then(res=>{
        document.getElementById("result").innerHTML = `
            <div class="card p-5 text-center">
                <h1 class="display-4 fw-bold">${res.prob}%</h1>
                <h3 class="mb-4">${res.risk_text}군</h3>
                <p class="fs-4">${res.advice}</p>
                <button class="btn btn-dark btn-lg mt-4" onclick="location.reload()">다시 검사하기</button>
            </div>
        `;
    })
    .catch(()=>{
        document.getElementById("result").innerHTML = `
            <div class="text-center text-white py-5">
                <h2>서버 오류가 발생했습니다</h2>
                <button class="btn btn-light mt-3" onclick="location.reload()">재시도</button>
            </div>
        `;
    });
};
</script>

</body>
</html>
