<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>StrokeGuard AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">
    <h1 class="text-center mb-4">StrokeGuard AI</h1>

    <div class="card p-4">
        <h4 class="mb-3">건강 정보 입력</h4>

        <div class="row g-3">
            <div class="col-md-6">
                <label>성별</label>
                <select id="gender" class="form-select">
                    <option value="1">남성</option>
                    <option value="2">여성</option>
                </select>
            </div>

            <div class="col-md-6">
                <label>나이</label>
                <input id="age" type="number" class="form-control">
            </div>

            <div class="col-md-6">
                <label>BMI</label>
                <input id="bmi" type="number" step="0.1" class="form-control">
            </div>

            <div class="col-md-6">
                <label>수축기 혈압</label>
                <input id="sbp" type="number" class="form-control">
            </div>

            <div class="col-md-6">
                <label>이완기 혈압</label>
                <input id="dbp" type="number" class="form-control">
            </div>

            <div class="col-md-6">
                <label>공복 혈당</label>
                <input id="glucose" type="number" step="0.1" class="form-control">
            </div>

            <div class="col-md-6">
                <label>흡연 여부</label>
                <select id="smoking" class="form-select">
                    <option value="0">아니오</option>
                    <option value="1">예</option>
                </select>
            </div>

            <div class="col-md-6">
                <label>음주 여부</label>
                <select id="drinking" class="form-select">
                    <option value="0">아니오</option>
                    <option value="1">예</option>
                </select>
            </div>
        </div>

        <button id="predictBtn" class="btn btn-primary btn-lg w-100 mt-4">
            AI 분석하기
        </button>
    </div>

    <div class="card p-4 mt-4 d-none" id="resultCard">
        <h2>예측 결과</h2>
        <h1 id="prob" class="text-primary"></h1>
        <p id="advice" class="fs-5 mt-3"></p>
    </div>
</div>

<script>
document.getElementById("predictBtn").onclick = () => {
    const data = {
        gender: document.getElementById("gender").value,
        age: document.getElementById("age").value,
        bmi: document.getElementById("bmi").value,
        sbp: document.getElementById("sbp").value,
        dbp: document.getElementById("dbp").value,
        glucose: document.getElementById("glucose").value,
        smoking: document.getElementById("smoking").value,
        drinking: document.getElementById("drinking").value
    };

    fetch("/predict", {
        method:"POST",
        headers: { "Content-Type":"application/json" },
        body: JSON.stringify(data)
    })
    .then(r=>r.json())
    .then(res=>{
        document.getElementById("resultCard").classList.remove("d-none");
        document.getElementById("prob").innerText = res.prob + "%";
        document.getElementById("advice").innerText = res.advice;
    });
};
</script>

</body>
</html>
