<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StrokeGuard AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Yoon+Gothic+700:wght@700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body {margin:0;background:#0f0f23;color:white;font-family:'Noto Sans KR',sans-serif;overflow-x:hidden}
        .hero{min-height:100vh;background:linear-gradient(135deg,#0f0f23 0%,#1a1a3a 50%,#2d1b69 100%);display:flex;align-items:center;justify-content:center;position:relative}
        .hero::before{content:'';position:absolute;top:0;left:0;right:0;bottom:0;background:url('https://images.unsplash.com/photo-1638207213803-3c093c7cd506?auto=format&fit=crop&q=80') center/cover;opacity:0.15}
        .hero-content{position:relative;z-index:2;max-width:900px;text-align:center;padding:0 20px}
        .title{font-size:clamp(4rem,10vw,7rem);font-weight:900;letter-spacing:-3px;margin:0 0 1.5rem;line-height:0.9;}
        .stroke{background:linear-gradient(90deg,#ff6b6b,#feca57);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .guard{color:#a29bfe;text-shadow:0 0 30px rgba(162,155,254,0.6)}
        .subtitle{font-size:1.5rem;font-weight:300;margin:0 0 3rem;opacity:0.9;line-height:1.7}
        .badges{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:4rem}
        .badge{background:rgba(255,255,255,0.12);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,0.2);padding:10px 24px;border-radius:50px;font-weight:500;}
        .tagline{font-size:1.6rem;font-weight:400;opacity:0.9}
        .icon{margin-right:12px;background:linear-gradient(135deg,#54a0ff,#a29bfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
        .card{background:rgba(255,255,255,0.95);color:#333;border-radius:28px;box-shadow:0 20px 60px rgba(80,40,150,0.2)}
        .btn-opt{width:48%;padding:22px;font-size:1.4rem;border:3px solid #6c5ce7;border-radius:20px;background:white;color:#6c5ce7;font-weight:700}
        .btn-opt.active,.btn-opt:hover{background:#6c5ce7;color:white}
        .progress{height:12px;border-radius:12px;background:#e0e0e0}
        .progress-bar{background:linear-gradient(90deg,#a29bfe,#6c5ce7)}
    </style>
</head>

<body>

<div class="hero">
    <div class="hero-content">
        <h1 class="title"><span class="stroke">Stroke</span><span class="guard">Guard</span> AI</h1>
        <p class="subtitle">국내 500만 명 + 미국 라벨링 데이터를 기반으로 동작하는<br>차세대 건강 위험 예측 시스템</p>
        <div class="badges">
            <span class="badge">광범위 데이터 기반 분석</span>
            <span class="badge">고감도 위험 탐지</span>
            <span class="badge">실시간 AI 주치의</span>
        </div>
    </div>
</div>

{% if not show_result %}
<div class="container my-5" id="survey">
    <div class="row justify-content-center"><div class="col-lg-9">
        <div class="card p-5">

            <form method="POST">
                <h2 class="text-center mb-5">건강 정보를 입력해주세요</h2>

                <input type="hidden" name="gender" id="gender">
                <input type="hidden" name="smoking" id="smoking">
                <input type="hidden" name="drinking" id="drinking">

                <div class="mb-3">
                    <label>나이</label>
                    <input class="form-control form-control-lg" type="number" name="age" required>
                </div>

                <div class="mb-3">
                    <label>BMI</label>
                    <input class="form-control form-control-lg" type="number" step="0.1" name="bmi" required>
                </div>

                <div class="mb-3">
                    <label>수축기 혈압</label>
                    <input class="form-control form-control-lg" type="number" name="sbp" required>
                </div>

                <div class="mb-3">
                    <label>이완기 혈압</label>
                    <input class="form-control form-control-lg" type="number" name="dbp" required>
                </div>

                <div class="mb-3">
                    <label>공복 혈당</label>
                    <input class="form-control form-control-lg" type="number" step="0.1" name="glucose" required>
                </div>

                <button class="btn btn-primary btn-lg mt-4 w-100">AI 예측하기</button>
            </form>

        </div>
    </div></div>
</div>

{% else %}
<div class="container my-5" id="result">
    <div class="row justify-content-center"><div class="col-lg-8">
        <div class="card p-5 text-white text-center" style="background:{{risk_class}}">
            <h1 class="display-1 fw-bold">{{prob}}%</h1>
            <h2 class="mb-4">{{risk_text}}군</h2>
            <p class="fs-4">{{advice}}</p>
            <button onclick="location.href='/'" class="btn btn-light btn-lg mt-4">다시 검사하기</button>
        </div>
    </div></div>
</div>
{% endif %}

</body>
</html>
