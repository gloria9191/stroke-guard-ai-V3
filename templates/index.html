<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>StrokeGuard AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Yoon+Gothic+700:wght@700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

    <style>
        body {margin:0;background:#0f0f23;color:white;font-family:'Noto Sans KR',sans-serif;overflow-x:hidden}
        
        /* === 표지 HERO 섹션 (이전 버전 그대로 복원) === */
        .hero{
            min-height:100vh;
            background:linear-gradient(135deg,#0f0f23 0%,#1a1a3a 50%,#2d1b69 100%);
            display:flex;align-items:center;justify-content:center;position:relative;
        }
        .hero::before{
            content:'';position:absolute;top:0;left:0;right:0;bottom:0;
            background:url('https://images.unsplash.com/photo-1638207213803-3c093c7cd506?ixlib=rb-4.0.3&auto=format&fit=crop&q=80') center/cover;
            opacity:0.15
        }
        .hero-content{position:relative;z-index:2;max-width:900px;text-align:center;padding:0 20px}

        .title{
            font-size:clamp(4rem,10vw,7rem);
            font-weight:900;letter-spacing:-3px;margin:0 0 1.5rem;line-height:0.9;
            font-family:'Yoon Gothic 700',sans-serif
        }
        .stroke{
            background:linear-gradient(90deg,#ff6b6b,#feca57);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
            background-clip:text
        }
        .guard{
            color:#a29bfe;text-shadow:0 0 30px rgba(162,155,254,0.6)
        }
        .subtitle{font-size:1.5rem;font-weight:300;margin:0 0 3rem;opacity:0.9;line-height:1.7}

        .badges{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin:0 0 4rem}
        .badge{
            background:rgba(255,255,255,0.12);backdrop-filter:blur(10px);
            border:1px solid rgba(255,255,255,0.2);
            padding:10px 24px;border-radius:50px;font-weight:500;transition:all 0.3s
        }
        .badge:hover{background:rgba(162,155,254,0.3);transform:translateY(-3px)}

        .tagline{font-size:1.6rem;font-weight:400;opacity:0.9}
        .icon{
            margin-right:12px;background:linear-gradient(135deg,#54a0ff,#a29bfe);
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;
            background-clip:text
        }

        /* Survey Card */
        .card{
            background:rgba(255,255,255,0.95);color:#333;border-radius:28px;
            box-shadow:0 20px 60px rgba(80,40,150,0.2);transition:0.4s
        }
        .card:hover{transform:translateY(-10px)}

        .btn-opt{
            width:48%;padding:22px;font-size:1.4rem;
            border:3px solid #6c5ce7;border-radius:20px;
            background:white;color:#6c5ce7;font-weight:700;
            transition:0.3s
        }
        .btn-opt.active,.btn-opt:hover{
            background:#6c5ce7;color:white;transform:scale(1.05)
        }

        .btn-step{
            background:linear-gradient(135deg,#a29bfe,#6c5ce7);
            color:white;padding:18px 70px;border-radius:50px;
            font-size:1.4rem;font-weight:700;
            box-shadow:0 15px 35px rgba(108,92,231,0.4)
        }

        .progress{height:12px;border-radius:12px;background:#e0e0e0}
        .progress-bar{background:linear-gradient(90deg,#a29bfe,#6c5ce7)}

        .result-high{background:linear-gradient(135deg,#ff6b6b,#feca57)}
        .result-medium{background:linear-gradient(135deg,#feca57,#ff9ff3)}
        .result-low{background:linear-gradient(135deg,#1dd1a1,#54a0ff)}
    </style>
</head>
<body>

<!-- === 표지 HERO === -->
<div class="hero">
    <div class="hero-content">
        <h1 class="title">
            <span class="stroke">Stroke</span><span class="guard">Guard</span> AI
        </h1>

        <p class="subtitle">국내 500만 명 + 미국 라벨링 데이터 기반<br>차세대 뇌졸중 예측 AI</p>

        <div class="badges">
            <span class="badge">다중 국가 기반 데이터</span>
            <span class="badge">뇌졸중 위험군 선별 특화</span>
            <span class="badge">AI 건강 조언 제공</span>
        </div>

        <p class="tagline">
            <span class="icon"><i class="fa-solid fa-brain"></i></span>
            작은 변화가 큰 미래를 만듭니다
        </p>
    </div>
</div>

<!-- === 설문 섹션 === -->
<div class="container my-5" id="survey">
    <div class="row justify-content-center"><div class="col-lg-9">
        <div class="card p-5">

            <div class="progress mb-5"><div class="progress-bar" id="prog" style="width:12.5%"></div></div>
            <h2 class="text-center mb-5" id="question">1/8 성별을 선택해주세요</h2>

            <div id="step1" class="text-center mb-4">
                <button class="btn btn-opt active" data-value="1">남성</button>
                <button class="btn btn-opt" data-value="2">여성</button>
            </div>

            <div id="step2" class="d-none text-center"><input type="number" class="form-control form-control-lg text-center" id="age" placeholder="나이"></div>

            <div id="step3" class="d-none text-center">
                <input type="number" class="form-control form-control-lg text-center" id="height" placeholder="키(예: 170)">
                <input type="number" class="form-control form-control-lg text-center mt-3" id="weight" placeholder="체중(예: 65)">
            </div>

            <div id="step4" class="d-none text-center"><input type="number" class="form-control form-control-lg text-center" id="sbp" placeholder="수축기 혈압"></div>

            <div id="step5" class="d-none text-center"><input type="number" class="form-control form-control-lg text-center" id="dbp" placeholder="이완기 혈압"></div>

            <div id="step6" class="d-none text-center"><input type="number" class="form-control form-control-lg text-center" id="glucose" placeholder="공복 혈당"></div>

            <div id="step7" class="d-none text-center mb-4">
                <p class="fs-3 fw-bold mb-4">흡연 여부</p>
                <button class="btn btn-opt active" data-value="0">아니오</button>
                <button class="btn btn-opt" data-value="1">예</button>
            </div>

            <div id="step8" class="d-none text-center mb-4">
                <p class="fs-3 fw-bold mb-4">음주 여부</p>
                <button class="btn btn-opt active" data-value="0">아니오</button>
                <button class="btn btn-opt" data-value="1">예</button>
            </div>

            <div class="text-center mt-5">
                <button id="prev" class="btn btn-outline-secondary btn-lg me-4 d-none">이전</button>
                <button id="next" class="btn btn-step">다음</button>
                <button id="submit" class="btn btn-danger btn-lg d-none">지금 예측하기</button>
            </div>

        </div>
    </div></div>
</div>

<!-- === 결과 섹션 === -->
<div class="container my-5 d-none" id="result">
    <div class="row justify-content-center"><div class="col-lg-8">
        <div class="card p-5 text-white text-center" id="resultCard">

        </div>
    </div></div>
</div>

<script src="/static/script.js"></script>
</body>
</html>
