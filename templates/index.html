
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Stroke Prediction</title>
</head>
<body>
    <h2>뇌졸중 위험도 예측</h2>
    <form action="/predict" method="POST">
        성별(1=남,2=여): <input name="sex" /><br>
        나이: <input name="age" /><br>
        BMI: <input name="bmi" /><br>
        수축기혈압: <input name="sbp" /><br>
        이완기혈압: <input name="dbp" /><br>
        공복혈당: <input name="glucose" /><br>
        흡연(1/0): <input name="smoking" /><br>
        음주(1/0): <input name="alcohol" /><br>
        <button type="submit">예측하기</button>
    </form>
</body>
</html>
