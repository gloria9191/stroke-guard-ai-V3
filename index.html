<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StrokeGuard AI</title>

<!-- CSS & Fonts -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
body {margin:0;background:#0f0f23;color:white;font-family:'Noto Sans KR',sans-serif;overflow-x:hidden}
.hero{min-height:100vh;background:linear-gradient(135deg,#0f0f23,#2d1b69);display:flex;align-items:center;justify-content:center;position:relative}
.hero::before{content:'';position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1638207213803-3c093c7cd506?auto=format&fit=crop&q=80') center/cover;opacity:0.15}
.title{font-size:clamp(4rem,10vw,7rem);font-weight:900;letter-spacing:-3px;margin-bottom:1.5rem}
.stroke{background:linear-gradient(90deg,#ff6b6b,#feca57);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.guard{color:#a29bfe;text-shadow:0 0 30px rgba(162,155,254,0.6)}
.subtitle{font-size:1.5rem;opacity:0.9;margin-bottom:3rem}
.badge{background:rgba(255,255,255,0.15);padding:10px 20px;border-radius:30px;margin:5px}
.card{background:white;color:#333;border-radius:20px;padding:40px}
.btn-opt{width:48%;padding:18px;font-size:1.3rem;border:3px solid #6c5ce7;border-radius:20px;background:white;color:#6c5ce7;font-weight:700;transition:0.3s}
.btn-opt.active,.btn-opt:hover{background:#6c5ce7;color:white}
.progress{height:12px;border-radius:12px;background:#e0e0e0}
.progress-bar{background:linear-gradient(90deg,#a29bfe,#6c5ce7)}
</style>
</head>

<body>

<!-- Hero Section -->
<div class="hero">
    <div class="hero-content text-center">
        <h1 class="title"><span class="stroke">Stroke</span><span class="guard">Guard</span> AI</h1>
        <p class="subtitle">국내 50만명 + 미국 NHANES 기반 차세대 뇌졸중 예측 모델</p>

        <div>
            <span class="badge">AUC 0.796</span>
            <span class="badge">AI 라이프스타일 코치</span>
            <span class="badge">의료급 ML 알고리즘</span>
        </div>
    </div>
</div>

<!-- Survey -->
<div class="container my-5">
    <div class="row justify-content-center">
    <div class="col-lg-8">

    <div class="card">
        <h3 class="text-center mb-4 fw-bold">뇌졸중 위험도 간편 검사</h3>

        <div class="progress mb-5">
            <div id="prog" class="progress-bar" style="width:12.5%"></div>
        </div>

        <h3 id="question" class="text-center mb-5">1/8 성별을 선택해주세요</h3>

        <div id="step1" class="text-center">
            <button class="btn-opt active" data-value="1">남성</button>
            <button class="btn-opt" data-value="2">여성</button>
        </div>

        <div id="step2" class="d-none"><input id="age" class="form-control form-control-lg text-center" type="number" placeholder="나이 (예: 65)"></div>
        <div id="step3" class="d-none"><input id="bmi" class="form-control form-control-lg text-center" type="number" step="0.1" placeholder="BMI (예: 23.5)"></div>
        <div id="step4" class="d-none"><input id="sbp" class="form-control form-control-lg text-center" type="number" placeholder="수축기 혈압 (예: 130)"></div>
        <div id="step5" class="d-none"><input id="dbp" class="form-control form-control-lg text-center" type="number" placeholder="이완기 혈압 (예: 85)"></div>
        <div id="step6" class="d-none"><input id="glucose" class="form-control form-control-lg text-center" type="number" step="0.1" placeholder="공복 혈당 (예: 110)"></div>

        <div id="step7" class="d-none text-center">
            <p class="fs-4 fw-bold">흡연하시나요?</p>
            <button class="btn-opt active" data-value="0">아니오</button>
            <button class="btn-opt" data-value="1">예</button>
        </div>

        <div id="step8" class="d-none text-center">
            <p class="fs-4 fw-bold">음주하시나요?</p>
            <button class="btn-opt active" data-value="0">아니오</button>
            <button class="btn-opt" data-value="1">예</button>
        </div>

        <div class="text-center mt-5">
            <button id="prev" class="btn btn-outline-secondary btn-lg me-4 d-none">이전</button>
            <button id="next" class="btn btn-primary btn-lg">다음</button>
            <button id="submit" class="btn btn-danger btn-lg d-none">예측하기</button>
        </div>

    </div>

    </div>
    </div>
</div>

<!-- JS -->
<script>
const questions = [
    "성별을 선택해주세요",
    "나이를 입력해주세요",
    "BMI를 입력해주세요",
    "수축기 혈압을 입력해주세요",
    "이완기 혈압을 입력해주세요",
    "공복 혈당을 입력해주세요",
    "흡연 여부를 선택해주세요",
    "음주 여부를 선택해주세요"
];

let step = 1;
const data = {gender:1, smoking:0, drinking:0};

document.querySelectorAll(".btn-opt").forEach(btn => {
    btn.onclick = () => {
        btn.parentNode.querySelectorAll(".btn-opt").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
    };
});

document.getElementById("next").onclick = () => {
    if(step===1) data.gender = document.querySelector("#step1 .active").dataset.value;
    if(step===7) data.smoking = document.querySelector("#step7 .active").dataset.value;
    if(step===8) data.drinking = document.querySelector("#step8 .active").dataset.value;

    if(step>=2 && step<=6){
        const ids=["","age","bmi","sbp","dbp","glucose"];
        const v=document.getElementById(ids[step]).value.trim();
        if(!v || parseFloat(v)<=0){ alert("값을 정확히 입력해주세요."); return; }
        data[ids[step]] = parseFloat(v);
    }

    document.getElementById("step"+step).classList.add("d-none");
    step++;
    document.getElementById("step"+step).classList.remove("d-none");

    document.getElementById("question").innerHTML = `${step}/8 ${questions[step-1]}`;
    document.getElementById("prog").style.width = (step*12.5)+"%";

    if(step===2) document.getElementById("prev").classList.remove("d-none");
    if(step===8){
        document.getElementById("next").classList.add("d-none");
        document.getElementById("submit").classList.remove("d-none");
    }
};

document.getElementById("prev").onclick = () => {
    document.getElementById("step"+step).classList.add("d-none");
    step--;
    document.getElementById("step"+step).classList.remove("d-none");

    document.getElementById("question").innerHTML = `${step}/8 ${questions[step-1]}`;
    document.getElementById("prog").style.width = (step*12.5)+"%";

    if(step===1){
        document.getElementById("prev").classList.add("d-none");
        document.getElementById("submit").classList.add("d-none");
        document.getElementById("next").classList.remove("d-none");
    }
};

document.getElementById("submit").onclick = () => {
    const params = new URLSearchParams(data);
    document.body.innerHTML = `
        <div style="min-height:100vh;display:flex;align-items:center;flex-direction:column;justify-content:center;color:white">
            <h2>AI가 분석 중입니다…</h2>
            <div class="spinner-border text-light" style="width:4rem;height:4rem"></div>
            <p class="mt-4 fs-4 text-muted">잠시만 기다려주세요</p>
        </div>
    `;
    fetch("/predict",{method:"POST",body:params}).then(r=>r.text()).then(html=>{
        document.open();document.write(html);document.close();
    });
};
</script>

</body>
</html>
